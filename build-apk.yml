name: Build Khabeer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Khabeer AI APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: mobile
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          archive-output: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khabeer-AI-APK
          path: ${{ steps.build.outputs.output-path }}
          if-no-files-found: error
